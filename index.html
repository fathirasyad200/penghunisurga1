<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PENGHUNISURGA - Pengatur Keuangan</title>
    <!-- Tailwind CSS & Chart.js -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #e0e5ec;
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
            --text-main: #4a5568;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .neo-box {
            background: var(--bg-color);
            box-shadow: 9px 9px 16px var(--shadow-dark), -9px -9px 16px var(--shadow-light);
            border-radius: 16px;
        }
        .neo-inset {
            background: var(--bg-color);
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
            border-radius: 12px;
            border: none;
            outline: none;
        }
        .neo-btn {
            background: var(--bg-color);
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            border-radius: 12px;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }
        .neo-btn:active {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <!-- Login Screen -->
    <div id="login-screen" class="max-w-md mx-auto mt-20 p-8 neo-box">
        <h2 class="text-2xl font-bold text-center mb-2 text-gray-700">PENGHUNISURGA</h2>
        <p class="text-xs text-center mb-6 text-gray-500">Silakan login untuk mengelola keuangan</p>
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="mb-4">
                <label class="block text-xs font-medium mb-2">Username</label>
                <input type="text" id="username" required class="w-full p-3 neo-inset text-sm" placeholder="Masukkan username">
            </div>
            <div class="mb-6">
                <label class="block text-xs font-medium mb-2">Password</label>
                <input type="password" id="password" required class="w-full p-3 neo-inset text-sm" placeholder="Masukkan password">
            </div>
            <button type="submit" class="w-full py-3 neo-btn font-bold text-green-600 text-sm">MASUK</button>
        </form>
        <div id="login-error" class="text-red-500 text-xs text-center mt-4 hidden"></div>
    </div>

    <!-- Main App Screen -->
    <div id="app-screen" class="max-w-4xl mx-auto hidden">
        <!-- Header: Clock, Date, Motivation -->
        <div class="neo-box p-6 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-lg font-bold text-gray-700">PENGHUNISURGA</h1>
                <div id="realtime-clock" class="text-xs font-semibold text-gray-500"></div>
            </div>
            <div class="neo-inset p-3 text-center md:text-right flex-1 max-w-md w-full">
                <p id="motivation-text" class="text-xs italic text-gray-600">"Menabung bukan soal besar kecilnya uang, tapi tentang konsistensi."</p>
            </div>
            <button onclick="handleLogout()" class="neo-btn px-4 py-2 text-xs font-bold text-red-500">Logout</button>
        </div>

        <!-- Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="neo-box p-5 text-center">
                <p class="text-xs text-gray-500 mb-1">Total Saldo</p>
                <h3 id="total-balance" class="text-lg font-bold text-blue-600">Rp 0</h3>
            </div>
            <div class="neo-box p-5 text-center">
                <p class="text-xs text-gray-500 mb-1">Total Pemasukan</p>
                <h3 id="total-income" class="text-lg font-bold text-green-600">Rp 0</h3>
            </div>
            <div class="neo-box p-5 text-center">
                <p class="text-xs text-gray-500 mb-1">Total Pengeluaran</p>
                <h3 id="total-expense" class="text-lg font-bold text-red-600">Rp 0</h3>
            </div>
        </div>

        <!-- Transaction Form & Chart -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div class="neo-box p-6">
                <h3 class="font-bold text-sm mb-4 text-gray-700">Tambah Transaksi</h3>
                <form id="transaction-form" onsubmit="handleAddTransaction(event)">
                    <div class="mb-3">
                        <label class="block text-xs font-medium mb-1">Tipe</label>
                        <select id="trx-type" class="w-full p-2 neo-inset text-xs">
                            <option value="Pemasukan">Pemasukan</option>
                            <option value="Pengeluaran">Pengeluaran</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="block text-xs font-medium mb-1">Nominal (Rp)</label>
                        <input type="number" id="trx-amount" required class="w-full p-2 neo-inset text-xs" placeholder="Contoh: 50000">
                    </div>
                    <div class="mb-3">
                        <label class="block text-xs font-medium mb-1">Kategori</label>
                        <input type="text" id="trx-category" required class="w-full p-2 neo-inset text-xs" placeholder="Contoh: Gaji / Makanan">
                    </div>
                    <div class="mb-3">
                        <label class="block text-xs font-medium mb-1">Tanggal</label>
                        <input type="date" id="trx-date" required class="w-full p-2 neo-inset text-xs">
                    </div>
                    <div class="mb-4">
                        <label class="block text-xs font-medium mb-1">Catatan</label>
                        <input type="text" id="trx-notes" class="w-full p-2 neo-inset text-xs" placeholder="Keterangan opsional">
                    </div>
                    <button type="submit" class="w-full py-2 neo-btn font-bold text-xs text-green-600">Simpan Transaksi</button>
                </form>
            </div>

            <div class="neo-box p-6 flex flex-col justify-between">
                <h3 class="font-bold text-sm mb-4 text-gray-700">Grafik Keuangan</h3>
                <div class="relative h-60">
                    <canvas id="financeChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Transaction History Table -->
        <div class="neo-box p-6">
            <h3 class="font-bold text-sm mb-4 text-gray-700">Riwayat Transaksi</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead>
                        <tr class="border-b border-gray-300 text-gray-500">
                            <th class="pb-2">Tanggal</th>
                            <th class="pb-2">Tipe</th>
                            <th class="pb-2">Kategori</th>
                            <th class="pb-2">Nominal</th>
                            <th class="pb-2">Catatan</th>
                        </tr>
                    </thead>
                    <tbody id="transaction-table-body">
                        <!-- Data injected via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ==========================================================
        // MASUKKAN URL GOOGLE APPS SCRIPT ANDA DI ANTARA TANDA KUTIP INI:
        // ==========================================================
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyKN_-jEaP_tzXT2sroob0VXNRMyX0PnrP_x6HD6FQJtuqW7RoQKW_eOgNcmeGac8QABQ/exec";

        const motivations = [
            "\"Menabung bukan soal besar kecilnya uang, tapi tentang konsistensi.\"",
            "\"Sedikit demi sedikit, lama-lama menjadi bukit. Mulai menabunglah hari ini!\"",
            "\"Kebebasan finansial dimulai dari disiplin mencatat setiap pengeluaran.\"",
            "\"Masa depan yang cerah dibangun dari tabungan yang bijak hari ini.\""
        ];

        function updateClock() {
            const now = new Date();
            document.getElementById('realtime-clock').innerText = now.toLocaleString('id-ID', { dateStyle: 'full', timeStyle: 'medium' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        document.getElementById('motivation-text').innerText = motivations[Math.floor(Math.random() * motivations.length)];

        let chartInstance = null;

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errDiv = document.getElementById('login-error');
            errDiv.classList.add('hidden');

            try {
                const res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'login', username, password })
                });
                const data = await res.json();
                if(data.success) {
                    document.getElementById('login-screen').classList.add('hidden');
                    document.getElementById('app-screen').classList.remove('hidden');
                    loadTransactions();
                } else {
                    errDiv.innerText = data.message || "Login gagal! Periksa username/password.";
                    errDiv.classList.remove('hidden');
                }
            } catch(err) {
                errDiv.innerText = "Terjadi kesalahan koneksi ke server.";
                errDiv.classList.remove('hidden');
            }
        }

        function handleLogout() {
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        async function loadTransactions() {
            try {
                const res = await fetch(WEB_APP_URL + "?action=getTransactions");
                const data = await res.json();
                if(data.success) {
                    renderDashboard(data.transactions);
                }
            } catch(err) {
                console.error("Gagal memuat transaksi", err);
            }
        }

        async function handleAddTransaction(e) {
            e.preventDefault();
            const type = document.getElementById('trx-type').value;
            const amount = parseFloat(document.getElementById('trx-amount').value);
            const category = document.getElementById('trx-category').value;
            const date = document.getElementById('trx-date').value;
            const notes = document.getElementById('trx-notes').value;

            try {
                const res = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'addTransaction', type, amount, category, date, notes })
                });
                const data = await res.json();
                if(data.success) {
                    document.getElementById('transaction-form').reset();
                    loadTransactions();
                }
            } catch(err) {
                console.error("Gagal menyimpan transaksi", err);
            }
        }

        function renderDashboard(transactions) {
            let totalIncome = 0;
            let totalExpense = 0;
            const tbody = document.getElementById('transaction-table-body');
            tbody.innerHTML = '';

            transactions.forEach(trx => {
                if(trx.type === 'Pemasukan') totalIncome += Number(trx.amount);
                else totalExpense += Number(trx.amount);

                const tr = document.createElement('tr');
                tr.className = 'border-b border-gray-200';
                tr.innerHTML = `
                    <td class="py-2">${trx.date}</td>
                    <td class="py-2 font-semibold ${trx.type === 'Pemasukan' ? 'text-green-600' : 'text-red-600'}">${trx.type}</td>
                    <td class="py-2">${trx.category}</td>
                    <td class="py-2">Rp ${Number(trx.amount).toLocaleString('id-ID')}</td>
                    <td class="py-2 text-gray-500">${trx.notes || '-'}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('total-income').innerText = `Rp ${totalIncome.toLocaleString('id-ID')}`;
            document.getElementById('total-expense').innerText = `Rp ${totalExpense.toLocaleString('id-ID')}`;
            document.getElementById('total-balance').innerText = `Rp ${(totalIncome - totalExpense).toLocaleString('id-ID')}`;

            renderChart(totalIncome, totalExpense);
        }

        function renderChart(income, expense) {
            const ctx = document.getElementById('financeChart').getContext('2d');
            if(chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Pemasukan', 'Pengeluaran'],
                    datasets: [{
                        data: [income, expense],
                        backgroundColor: ['#48bb78', '#f56565']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }
    </script>
</body>
</html>
